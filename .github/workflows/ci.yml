name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-launcher:
    name: Windows launcher and daily-use safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          $launcherPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/start.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($launcherPath, [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.32'
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest tests/test_daily_safety.py -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.32'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: uv run pip-audit
      - run: npm audit --audit-level=high
        working-directory: frontend
