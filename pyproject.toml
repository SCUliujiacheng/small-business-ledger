[project]
name = "small-business-ledger"
version = "0.3.0"
description = "A local-first ledger for sales, expenses and cash settlements"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/small_business_ledger"]
